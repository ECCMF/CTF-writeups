<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My CTF writeups</title>
</head>
<body>
  <header>
    <h1>CTF writeups</h1>
  </header>

  <nav aria-label="CTF Writeups">
    <h2>Menu</h2>
    <div id="menu">Loading…</div>
  </nav>

  <main>
    <article id="content">
      <p>Select a page from the menu.</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.js"></script>
  <script>
    const menu = document.getElementById('menu');
    const content = document.getElementById('content');

    function isRelativeUrl(value) {
      return value &&
        !value.startsWith('#') &&
        !value.startsWith('/') &&
        !/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(value);
    }

    function fixRelativeUrls(container, markdownPath) {
      const markdownUrl = new URL(markdownPath, window.location.href);

      container.querySelectorAll('img[src]').forEach((img) => {
        const src = img.getAttribute('src');
        if (isRelativeUrl(src)) {
          img.src = new URL(src, markdownUrl).href;
        }
      });

      container.querySelectorAll('a[href]').forEach((link) => {
        const href = link.getAttribute('href');
        if (isRelativeUrl(href)) {
          link.href = new URL(href, markdownUrl).href;
        }
      });
    }

    async function renderMarkdown(path) {
      content.innerHTML = '<p>Loading…</p>';

      const response = await fetch(path);
      if (!response.ok) {
        throw new Error(`Could not load ${path} (${response.status})`);
      }

      const markdown = await response.text();
      content.innerHTML = marked.parse(markdown);
      fixRelativeUrls(content, path);

      history.replaceState(null, '', `#${encodeURIComponent(path)}`);
    }

    function buildMenu(entries) {
      menu.innerHTML = '';

      const bySite = new Map();
      for (const entry of entries) {
        if (!bySite.has(entry.site)) bySite.set(entry.site, []);
        bySite.get(entry.site).push(entry);
      }

      for (const [site, pages] of bySite) {
        const details = document.createElement('details');
        details.open = true;

        const summary = document.createElement('summary');
        summary.textContent = site;
        details.appendChild(summary);

        const list = document.createElement('ul');

        for (const page of pages) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.href = `#${encodeURIComponent(page.path)}`;
          link.textContent = page.label;
          link.addEventListener('click', (event) => {
            event.preventDefault();
            renderMarkdown(page.path).catch(showError);
          });
          item.appendChild(link);
          list.appendChild(item);
        }

        details.appendChild(list);
        menu.appendChild(details);
      }
    }

    function showError(error) {
      console.error(error);
      content.textContent = error.message;
    }

    async function start() {
      try {
        const response = await fetch('manifest.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Could not load manifest.json (${response.status})`);
        }

        const entries = await response.json();
        buildMenu(entries);

        const requestedPath = decodeURIComponent(window.location.hash.slice(1));
        const initial = entries.find((entry) => entry.path === requestedPath) || entries[0];

        if (initial) {
          await renderMarkdown(initial.path);
        } else {
          content.innerHTML = '<p>No writeup.md files were found.</p>';
        }
      } catch (error) {
        showError(error);
      }
    }

    start();
  </script>
</body>
</html>
